<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscrizione confermata — Cimiterologia — Tlon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bianco: #ffffff;
            --nero: #2d3a35;
            --ottanio: #3d8b8b;
            --verde-salvia: #7a9e8e;
            --verde-acqua: #a8c5b8;
            --verde-pallido: #e8f2ed;
            --verde-chiaro: #f2f7f4;
            --grigio: #8a9a92;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bianco);
            color: var(--nero);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .logo {
            margin-bottom: 3rem;
        }

        .logo img {
            height: 32px;
            width: auto;
        }

        .candle-icon {
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .candle-icon svg {
            width: 48px;
            height: 48px;
        }

        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 400;
            font-style: italic;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--verde-salvia);
        }

        p {
            font-size: 1.1rem;
            color: var(--grigio);
            max-width: 420px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        a.back {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--verde-salvia);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--bianco);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        a.back:hover {
            background: var(--ottanio);
        }
    </style>
</head>
<body>
    <a href="./" class="logo"><img src="./assets/images/tlon-logo.png" alt="Tlon"></a>
    
    <div class="candle-icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="24" width="8" height="20" rx="2" fill="#e8dcc8"/>
            <ellipse cx="24" cy="18" rx="6" ry="8" fill="url(#flame)"/>
            <defs>
                <linearGradient id="flame" x1="24" y1="10" x2="24" y2="26" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#fff5c8" stop-opacity="0.9"/>
                    <stop offset="50%" stop-color="#ffc878" stop-opacity="0.7"/>
                    <stop offset="100%" stop-color="#ffa050" stop-opacity="0.5"/>
                </linearGradient>
            </defs>
        </svg>
    </div>

    <h1>Iscrizione avvenuta</h1>
    <p>Ci vediamo al cimitero.</p>
    
    <a href="./cimiterologia.html" class="back">Torna alla pagina</a>
</body>
</html>
