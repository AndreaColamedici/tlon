<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Sirene. IA: Intelligenza Apocalittica. Come districarsi tra allarmismi e marketing. Un gioco di Genia Lab, Accademia di Arti e Nuove Tecnologie di Roma."><meta property="og:title" content="Sirene · Genia Lab"><meta property="og:type" content="website"><meta property="og:url" content="https://tlon.it/genialab/"><link rel="icon" href="/favicon.svg"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Sirene</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap">
<style>
/* Una scena notturna a tutto schermo: il mare in WebGL sotto, l'argomento in serif sopra. Quattro colori, uno per ogni operazione della grammatica apocalittica. Tema scuro per scelta, pensato per il proiettore. */
:root {
  --night: #02050a;
  --foam: #eef2f0;
  --mist: #a7b9be;
  --dim: #66797f;
  --siren: #f3b2c9;
  --gold: #e8c47e;
  --t: #8fc6ff;
  --s: #f3a6c8;
  --n: #e8c47e;
  --i: #a8ecd0;
  --display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --u: min(1vw, 1.58vh);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--foam); font-family: var(--display); overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: filter .6s; }
body.proj #gl { filter: brightness(1.45) contrast(1.12) saturate(1.15); }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%); }
.veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; z-index: 3; background: linear-gradient(to right, rgba(2,5,10,.9) 0%, rgba(2,5,10,.7) 42%, rgba(2,5,10,0) 72%); }
body[data-v="text"] .veil { opacity: 1; }
body[data-v="low"] .veil { opacity: 1; background: linear-gradient(to top, rgba(2,5,10,.93) 0%, rgba(2,5,10,.72) 40%, rgba(2,5,10,0) 72%); }
body[data-v="an"] .veil { opacity: 1; background: linear-gradient(to top, rgba(2,5,10,.95) 0%, rgba(2,5,10,.82) 30%, rgba(2,5,10,.5) 46%, rgba(2,5,10,0) 66%), linear-gradient(to right, rgba(2,5,10,.85) 0%, rgba(2,5,10,.45) 50%, rgba(2,5,10,0) 76%); }
body[data-v="full"] .veil { opacity: 1; background: rgba(2,5,10,.72); }

#hud {
  position: fixed; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + clamp(12px, 2.2vh, 28px));
  padding-left: max(clamp(16px, calc(2.4 * var(--u)), 44px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, calc(2.4 * var(--u)), 44px), env(safe-area-inset-right, 0px));
  pointer-events: none; z-index: 5; transition: opacity 1.2s;
}
.brand { font-family: var(--mono); font-size: clamp(10px, calc(.78 * var(--u)), 14px); letter-spacing: .26em; text-transform: uppercase; color: var(--mist); }
.brand b { color: var(--foam); font-weight: 500; }
.hud-r { display: flex; align-items: center; gap: 18px; }
#act { font-family: var(--mono); font-size: clamp(10px, calc(.78 * var(--u)), 14px); letter-spacing: .22em; text-transform: uppercase; color: var(--mist); }
#rope { width: clamp(170px, calc(16 * var(--u)), 300px); height: 34px; overflow: visible; }

#layer {
  position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow-y: auto; scrollbar-width: none;
  display: flex; flex-direction: column;
  padding-left: max(clamp(16px, calc(5 * var(--u)), 110px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, calc(5 * var(--u)), 110px), env(safe-area-inset-right, 0px));
  padding-block: clamp(64px, 9vh, 120px) clamp(60px, 9vh, 110px);
  transition: opacity .6s ease;
}
#layer.out { opacity: 0; }
#layer > * { pointer-events: auto; }
.lbl { font-family: var(--mono); font-size: clamp(11px, calc(.92 * var(--u)), 17px); letter-spacing: .24em; text-transform: uppercase; color: var(--siren); }
.lbl.gold { color: var(--gold); }
.lbl.dim { color: var(--dim); }
.shade { text-shadow: 0 2px 30px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.6); }

/* titolo */
.title-wrap { margin-top: auto; margin-bottom: clamp(36px, 9vh, 120px); display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 1.8vh, 22px); text-align: center; }
.title-sub { font-style: italic; font-size: clamp(22px, calc(2.4 * var(--u)), 46px); line-height: 1.12; max-width: 30ch; text-wrap: balance; margin: 0; }
.sail {
  margin-top: clamp(6px, 1.2vh, 16px); appearance: none; cursor: pointer; background: transparent; color: var(--foam);
  border: 1px solid rgba(238,242,240,.35); border-radius: 999px; padding: 12px 30px;
  font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .3em; text-transform: uppercase;
  transition: border-color .3s, color .3s;
}
.sail:hover, .sail:focus-visible { border-color: var(--gold); color: var(--gold); outline: none; }

/* pagine di argomento */
.epi { margin-block: auto; display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 32px); max-width: min(1320px, 100%); }
.epi.narrow { max-width: min(1000px, 62vw); }
.epi.center { align-items: center; text-align: center; margin-inline: auto; }
.epi h2 { margin: 0; font-weight: 400; font-size: clamp(34px, calc(4.3 * var(--u)), 84px); line-height: 1.0; letter-spacing: -.012em; max-width: 22ch; text-wrap: balance; }
.epi h2 em { color: var(--siren); }
.epi p { margin: 0; font-size: clamp(18px, calc(1.6 * var(--u)), 31px); line-height: 1.3; max-width: 52ch; text-wrap: pretty; }
.epi p.small { font-family: var(--mono); font-size: clamp(11px, calc(.95 * var(--u)), 17px); letter-spacing: .06em; color: var(--mist); line-height: 1.6; max-width: 80ch; }
.epi p.de { font-style: italic; color: var(--dim); font-size: clamp(16px, calc(1.3 * var(--u)), 24px); }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, calc(2.6 * var(--u)), 52px); }
.cols.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.col { border-top: 1px solid rgba(238,242,240,.22); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col h3 { margin: 0; font-weight: 400; font-size: clamp(26px, calc(2.5 * var(--u)), 48px); line-height: 1; }
.col .who3 { font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .1em; color: var(--mist); }
.col p { font-size: clamp(16px, calc(1.3 * var(--u)), 25px); line-height: 1.3; color: var(--foam); }
.col.tag { border-top-color: var(--c); }
.col.tag .lbl { color: var(--c); }
.col.tag .qq { font-style: italic; font-size: clamp(20px, calc(1.75 * var(--u)), 33px); line-height: 1.12; }
.col.tag p { color: var(--mist); }

/* la frase da smontare */
.an { margin-block: auto; display: flex; flex-direction: column; gap: clamp(10px, 1.7vh, 24px); max-width: min(1500px, 100%); }
.sent { margin: 0; font-style: italic; font-weight: 400; font-size: clamp(30px, calc(3.6 * var(--u)), 70px); line-height: 1.12; letter-spacing: -.005em; max-width: 27ch; text-wrap: pretty; }
.sent.long { font-size: clamp(24px, calc(2.55 * var(--u)), 50px); max-width: 38ch; line-height: 1.16; }
.sent.read { font-size: clamp(20px, calc(2.1 * var(--u)), 40px); max-width: 46ch; line-height: 1.14; }
.sent::before { content: "«"; color: var(--dim); }
.sent::after { content: "»"; color: var(--dim); }
.sent mark { background: none; color: var(--c); text-decoration: underline; text-decoration-color: var(--c); text-decoration-thickness: .06em; text-underline-offset: .18em; transition: color .8s; }
.sent mark sup { font-family: var(--mono); font-style: normal; font-size: .3em; letter-spacing: .1em; vertical-align: super; margin-left: .15em; }
.sent mark.now { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 0%, 100% { text-shadow: 0 0 0 transparent; } 50% { text-shadow: 0 0 26px var(--c); } }
.who-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; }
.who-line .who { font-style: normal; font-size: clamp(28px, calc(2.9 * var(--u)), 56px); line-height: 1; }
.who-line .when { font-family: var(--mono); font-size: clamp(12px, calc(1 * var(--u)), 18px); letter-spacing: .06em; color: var(--i); }
.orig { margin: 0; font-style: italic; color: var(--mist); font-size: clamp(14px, calc(1.1 * var(--u)), 21px); line-height: 1.3; max-width: 110ch; }
.qs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, calc(1.8 * var(--u)), 34px); background: rgba(2,5,10,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 10px 18px 12px; margin-inline: -18px; border-radius: 8px; }
.qc { border-top: 1px solid var(--c); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; opacity: .38; transition: opacity .8s; min-width: 0; }
.qc.on { opacity: 1; }
.qc .lbl { color: var(--c); }
.qc .qq { font-style: italic; font-size: clamp(17px, calc(1.45 * var(--u)), 28px); line-height: 1.12; }
.qc .note { font-size: clamp(16px, calc(1.3 * var(--u)), 25px); line-height: 1.26; color: var(--foam); }
.rew { display: flex; flex-direction: column; gap: clamp(12px, 2vh, 24px); margin-block: auto; max-width: min(1300px, 100%); }
.rew .new { margin: 0; font-size: clamp(30px, calc(3.3 * var(--u)), 64px); line-height: 1.1; max-width: 30ch; text-wrap: pretty; }
.rew .chips { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .14em; text-transform: uppercase; }
.rew .chips span { color: var(--c); }
.rew .chips span::before { content: "● "; }


/* i padroni del canto */
.dossier { margin-block: auto; display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 22px); max-width: min(1400px, 100%); }
.dossier .who { margin: 0; font-weight: 400; font-size: clamp(40px, calc(4.6 * var(--u)), 90px); line-height: .95; }
.dossier .role { font-family: var(--mono); font-size: clamp(11px, calc(.95 * var(--u)), 17px); letter-spacing: .1em; color: var(--mist); }
.dossier .rows { display: flex; flex-direction: column; border-top: 1px solid rgba(238,242,240,.18); }
.dossier .row { display: grid; grid-template-columns: minmax(7em, 10em) minmax(0, 1fr); gap: 20px; padding-block: clamp(5px, .9vh, 11px); border-bottom: 1px solid rgba(238,242,240,.12); align-items: baseline; }
.dossier .row .d { font-family: var(--mono); font-size: clamp(11px, calc(.95 * var(--u)), 17px); letter-spacing: .06em; color: var(--gold); }
.dossier .row .t { font-size: clamp(16px, calc(1.3 * var(--u)), 25px); line-height: 1.22; }
.dossier .read { margin: 0; font-style: italic; color: var(--siren); font-size: clamp(19px, calc(1.75 * var(--u)), 33px); line-height: 1.2; max-width: 52ch; }
.epi p.coda { font-style: italic; color: var(--siren); font-size: clamp(19px, calc(1.75 * var(--u)), 33px); line-height: 1.22; }

/* bande cinematografiche nei momenti di silenzio */
.bar { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 4; transition: height 1.4s cubic-bezier(.4,0,.2,1); pointer-events: none; }
.bar.top { top: 0; } .bar.bot { bottom: 0; }
body[data-bars="1"] .bar { height: 8vh; }
/* il voto della sala */
.vote { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.chip { appearance: none; cursor: pointer; background: rgba(2,5,10,.5); border: 1px solid rgba(238,242,240,.3); color: var(--foam); border-radius: 999px; padding: 9px 20px; font-family: var(--mono); font-size: clamp(11px, calc(.95 * var(--u)), 17px); letter-spacing: .18em; text-transform: uppercase; transition: border-color .3s, background .3s; }
.chip b { color: var(--gold); font-weight: 500; margin-right: 10px; }
.chip:hover, .chip:focus-visible { border-color: var(--gold); outline: none; }
.chip.on { border-color: var(--gold); background: rgba(232,196,126,.16); }
.hall { font-family: var(--mono); font-size: clamp(11px, calc(.85 * var(--u)), 15px); letter-spacing: .06em; line-height: 1.5; color: var(--mist); max-width: 120ch; }
.hall b { color: var(--gold); font-weight: 500; }
.knots { display: flex; flex-direction: column; gap: 8px; }
.knots div { font-style: italic; font-size: clamp(22px, calc(2.3 * var(--u)), 44px); line-height: 1.12; }
.knots div::before { content: "∞  "; font-style: normal; color: var(--gold); font-size: .6em; vertical-align: .2em; }

/* i bivi */
.forks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.8vw, 32px); }
.fork { appearance: none; cursor: pointer; text-align: left; color: var(--foam); font-family: var(--display); background: rgba(2,5,10,.55); border: 1px solid rgba(238,242,240,.22); border-radius: 8px; padding: clamp(14px, 1.6vw, 26px); display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: border-color .3s, background .3s, transform .3s; }
.fork:hover, .fork:focus-visible { border-color: var(--gold); outline: none; transform: translateY(-2px); }
.fork.on { border-color: var(--gold); background: rgba(232,196,126,.14); }
.fork .n { font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .2em; color: var(--gold); }
.fork h3 { margin: 0; font-weight: 400; font-size: clamp(26px, calc(2.6 * var(--u)), 50px); line-height: 1; }
.fork p { margin: 0; font-size: clamp(15px, calc(1.25 * var(--u)), 24px); line-height: 1.3; color: var(--mist); }
.fork .cons { font-family: var(--mono); font-size: clamp(10px, calc(.8 * var(--u)), 14px); letter-spacing: .08em; color: var(--siren); line-height: 1.5; }
@media (max-width: 860px) { .forks { grid-template-columns: 1fr; } }

/* forme diverse per momenti diversi */
.sent.headline { font-style: normal; text-transform: uppercase; letter-spacing: .01em; font-size: clamp(26px, calc(3.1 * var(--u)), 60px); line-height: 1.02; max-width: 24ch; }
.sent.headline::before, .sent.headline::after { content: ""; }
.sent.statement { font-style: normal; }
.kicker { font-family: var(--mono); font-size: clamp(10px, calc(.8 * var(--u)), 14px); letter-spacing: .22em; text-transform: uppercase; color: var(--mist); }
.sig { font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .12em; color: var(--mist); }
.sig b { color: var(--foam); font-weight: 500; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(20px, 3vw, 60px); align-items: start; }
.pair > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pair .sent { font-size: clamp(20px, calc(2.1 * var(--u)), 40px); max-width: 100%; }
.bignum { font-family: var(--display); font-size: clamp(90px, calc(12 * var(--u)), 230px); line-height: .88; letter-spacing: -.03em; color: var(--gold); margin: 0; }
.risk .fact.sub { font-size: clamp(18px, calc(1.6 * var(--u)), 32px); }
.timeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 2.4vw, 48px); position: relative; }
.timeline::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 1px; background: rgba(232,196,126,.4); }
.tl { padding-top: 26px; position: relative; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.tl::before { content: ""; position: absolute; left: 0; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); }
.tl .yr { font-family: var(--mono); font-size: clamp(22px, calc(2.2 * var(--u)), 40px); color: var(--gold); letter-spacing: .05em; }
.tl h3 { margin: 0; font-weight: 400; font-size: clamp(24px, calc(2.2 * var(--u)), 42px); line-height: 1; }
.tl .op { font-family: var(--mono); font-size: clamp(10px, calc(.8 * var(--u)), 14px); letter-spacing: .14em; text-transform: uppercase; color: var(--mist); }
.tl p { margin: 0; font-size: clamp(15px, calc(1.2 * var(--u)), 23px); line-height: 1.3; }
.fab { margin-block: auto; display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 30px); max-width: min(1400px, 100%); }
.fab .step { font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .2em; text-transform: uppercase; color: var(--c, var(--gold)); }
.fab .sent { font-style: normal; }
.fab .sent::before, .fab .sent::after { content: ""; }
.fab .note { margin: 0; font-size: clamp(17px, calc(1.5 * var(--u)), 30px); line-height: 1.3; max-width: 56ch; color: var(--foam); }
.fab .ops { display: flex; gap: 22px; flex-wrap: wrap; }
.fab .ops span { font-family: var(--mono); font-size: clamp(11px, calc(.85 * var(--u)), 15px); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.fab .ops span.on { color: var(--c); }
@media (max-width: 860px) { .pair, .timeline { grid-template-columns: 1fr; } }

/* rischi */
.risk { margin-block: auto; display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 28px); max-width: min(1150px, 66vw); }
.risk .fact { margin: 0; font-size: clamp(26px, calc(2.65 * var(--u)), 52px); line-height: 1.1; text-wrap: pretty; }
.risk .src { font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .05em; color: var(--mist); line-height: 1.6; }
.risk .why { margin: 0; font-style: italic; font-size: clamp(19px, calc(1.7 * var(--u)), 32px); line-height: 1.25; color: var(--siren); max-width: 46ch; }

/* dal vivo */
.live { margin-block: auto; display: flex; flex-direction: column; gap: clamp(12px, 2vh, 24px); max-width: min(1500px, 100%); }
.live form { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; max-width: 1200px; }
.live input {
  flex: 1 1 520px; min-width: 0; background: rgba(2,5,10,.6); color: var(--foam); border: 1px solid rgba(238,242,240,.3); border-radius: 6px;
  font-family: var(--display); font-style: italic; font-size: clamp(20px, calc(1.9 * var(--u)), 36px); padding: 12px 18px;
}
.live input:focus { outline: none; border-color: var(--gold); }
.live button { appearance: none; cursor: pointer; background: var(--gold); color: var(--night); border: 0; border-radius: 6px; padding: 0 26px; font-family: var(--mono); font-size: clamp(12px, calc(1 * var(--u)), 17px); letter-spacing: .2em; text-transform: uppercase; }
.live button:disabled { opacity: .5; cursor: default; }
.live .status { font-family: var(--mono); font-size: clamp(11px, calc(.9 * var(--u)), 16px); letter-spacing: .1em; color: var(--mist); min-height: 1.6em; }

/* comandi */
#hint {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(10px, 1.8vh, 22px));
  padding-left: max(clamp(16px, calc(2.4 * var(--u)), 44px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, calc(2.4 * var(--u)), 44px), env(safe-area-inset-right, 0px));
  font-family: var(--mono); font-size: clamp(9px, calc(.68 * var(--u)), 12px); letter-spacing: .14em; color: var(--dim); text-transform: uppercase;
  transition: opacity 1.4s;
}
#hint.idle { opacity: .1; }
body[data-started="1"] #hint { opacity: 0; pointer-events: none; }
body[data-started="1"] #hint.peek { opacity: 1; pointer-events: auto; }
#hint .keys { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
#hint button { appearance: none; background: none; border: 0; color: var(--mist); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 6px 4px; }
#hint button:hover, #hint button:focus-visible { color: var(--foam); outline: none; }
#count { font-variant-numeric: tabular-nums; }
#sources {
  position: fixed; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
  width: min(480px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
  background: rgba(2,5,10,.9); border: 1px solid rgba(238,242,240,.16); border-radius: 6px; padding: 16px 18px;
  font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--mist);
}
#sources a { color: var(--foam); text-decoration-color: rgba(238,242,240,.3); text-underline-offset: 3px; display: block; }
#sources .h { color: var(--siren); letter-spacing: .2em; text-transform: uppercase; font-size: 10px; margin-bottom: 8px; }

@media (max-width: 860px) {
  body { overflow: auto; }

  target.lerp(new T.Vector3(6, 2.5, cam.z + 50).lerp(new T.Vector3(0, 1, cam.z - 90), cam.ahead), cam.rise);
  frame.aim = frame.aim || new T.PerspectiveCamera();
  frame.aim.position.copy(camPos); frame.aim.up.set(0, 1, 0); frame.aim.lookAt(target);
  frame.aim.rotateZ(roll * .6 * (1 - cam.rise));
  if (frame.snapAim) { GL.camera.quaternion.copy(frame.aim.quaternion); frame.snapAim = false; }
  else GL.camera.quaternion.slerp(frame.aim.quaternion, 1 - Math.exp(-dt * 1.2));
  GL.U.uCam.value.copy(camPos);
  GL.ocean.position.set(camPos.x, 0, camPos.z);
  GL.sky.position.copy(camPos);

  let best = null, bestI = -1;
  GL.sirens.forEach((s, i) => {
    let want = cfg.all ? cfg.sing : (i === cfg.focus ? cfg.sing : (i === cfg.also ? cfg.sing * .8 : 0));
    if (!cfg.all && cfg.focus < 0 && !cfg.hush && Math.abs(sirenZ(i) - cam.z) < 260 && sirenZ(i) < cam.z) want = .06;
    s.sing += (want - s.sing) * (1 - Math.exp(-dt * (cfg.hush ? 6 : 1.4)));
    const pulse = i === cfg.focus ? AU.amp : 0;
    s.fm.uniforms.uSing.value = s.sing * (GL.composer && GL.post ? .45 : 1); s.fm.uniforms.uAmp.value = pulse;
    s.rm.uniforms.uGlow.value = s.sing * (.8 + pulse * .6);
    s.glow.material.opacity = s.sing * (.38 + pulse * .3) * (1 - cam.dark) * (GL.composer && GL.post ? .35 : 1);
    if (!best || s.sing > best.sing) { best = s; bestI = i; }
  });
  if (best) {
    const v = state.votes[bestI], c = SIRENS[bestI].col;
    const tint = v === "A" ? [1, .62, .55] : v === "P" ? [1, .92, .62] : [1, 1, 1];
    GL.SU.uSirenPos.value.copy(best.head); GL.SU.uSirenCol.value.set(c[0] * tint[0], c[1] * tint[1], c[2] * tint[2]); GL.SU.uSiren.value = best.sing * (1 - cam.dark);
    best.fm.uniforms.uCol.value.set(c[0] * tint[0], c[1] * tint[1], c[2] * tint[2]);
  }

  const vm = GL.voiceMat.uniforms;
  const vOn = cfg.voiceOn || 0;
  vm.uOn.value += (vOn - vm.uOn.value) * (1 - Math.exp(-dt * 1.2));
  if (cfg.focus >= 0) {
    const S = GL.sirens[cfg.focus].head, C = camPos.clone().add(new T.Vector3(0, -1.2, -6));
    vm.uS.value.copy(S); vm.uC.value.copy(C); vm.uM.value.copy(S).lerp(C, .5).add(new T.Vector3(0, 6, 0));
    vm.uCol.value.set(...SIRENS[cfg.focus].col);
  }
  vm.uAmp.value = AU.amp;

  const { tp, tt, ta, tta, tk, TN } = GL;
  for (let i = 0; i < TN; i++) {
    const k = tk[i], j = i * 3;
    tp[j] += (tt[j] - tp[j]) * k; tp[j + 1] += (tt[j + 1] - tp[j + 1]) * k; tp[j + 2] += (tt[j + 2] - tp[j + 2]) * k;
    ta[i] += (tta[i] * (1 - cam.dark * .6) - ta[i]) * k * 1.3;
  }
  GL.tgeo.attributes.position.needsUpdate = true; GL.tgeo.attributes.aA.needsUpdate = true;

  const fovT = 52 - 5 * (cfg.voiceOn || 0);
  if (Math.abs(GL.camera.fov - fovT) > .01) { GL.camera.fov += (fovT - GL.camera.fov) * (1 - Math.exp(-dt * .8)); GL.camera.updateProjectionMatrix(); }
  const sh = GL.shoot;
  if (t > sh.next && sh.t0 === 0) {
    sh.t0 = t; sh.dur = .9 + Math.random() * .6;
    const x = (Math.random() - .5) * 1600, y = 300 + Math.random() * 500, dx = (Math.random() < .5 ? -1 : 1) * (200 + Math.random() * 300), dy = -(120 + Math.random() * 160);
    sh.from.set(x, y, -1300); sh.to.set(x + dx, y + dy, -1300);
    GL.meteor.material.rotation = Math.atan2(dy, dx) + Math.PI;
  }
  if (sh.t0) {
    const k = (t - sh.t0) / sh.dur;
    if (k >= 1) { sh.t0 = 0; sh.next = t + 7 + Math.random() * 14; GL.meteor.material.opacity = 0; }
    else { GL.meteor.position.lerpVectors(sh.from, sh.to, k); GL.meteor.material.opacity = Math.sin(k * Math.PI) * .9 * (1 - cam.dark); }
  }
  if (GL.composer && GL.post) {
    const focusSing = cfg.focus >= 0 ? GL.sirens[cfg.focus].sing : 0;
    GL.bloom.strength = (.32 + focusSing * .2 + AU.amp * .18) * (1 - cam.dark * .6);
    GL.film.uniforms.uTime.value = t;
    GL.composer.render();
  } else GL.renderer.render(GL.scene, GL.camera);
}

function qsHTML(onTags, notes, now) {

/* --- analisi dal vivo --- */
const LIVE = { text: "", res: null, status: "", busy: false };
function liveSegments(text, res) {
  const tagAt = new Array(text.length).fill(null);
  ["T", "S", "N"].forEach(k => (res[k] && Array.isArray(res[k].parole) ? res[k].parole : []).forEach(w => {
    if (typeof w !== "string" || !w.trim()) return;
    let from = 0, at;
    while ((at = text.toLowerCase().indexOf(w.toLowerCase(), from)) >= 0) { for (let c = at; c < at + w.length; c++) if (!tagAt[c]) tagAt[c] = k; from = at + w.length; }
  }));
  const seg = []; let cur = "", ct = tagAt[0];
  for (let c = 0; c < text.length; c++) { if (tagAt[c] !== ct) { seg.push([cur, ct]); cur = ""; ct = tagAt[c]; } cur += text[c]; }
  if (cur) seg.push([cur, ct]);
  return seg;
}
function liveHTML(text, res) {
  const notes = {}; ORDER.forEach(k => { notes[k] = res[k] && typeof res[k].nota === "string" ? res[k].nota : ""; });
  return `<blockquote class="sent shade" style="font-size:clamp(24px,calc(2.6 * var(--u)),50px);max-width:40ch">${sentHTML(liveSegments(text, res), ["T", "S", "N"], null)}</blockquote>
    ${qsHTML(ORDER, notes, null)}
    ${typeof res.riscrittura === "string" && res.riscrittura ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px"><div class="lbl dim">La stessa frase nella grammatica opposta</div><p class="shade" style="margin:0;font-size:clamp(20px,calc(1.9 * var(--u)),36px);line-height:1.15;max-width:50ch">${esc(res.riscrittura)}</p></div>` : ""}`;
}
const LIVE_PROMPT = f => `Sei uno strumento di analisi retorica usato durante una lezione pubblica sull'intelligenza artificiale, davanti a studenti ed esperti. Analizza la frase tra <frase> e </frase> con quattro domande.
T, Tempo: quali parole spostano l'evento decisivo nel futuro, o lo presentano come un declino già in corso?
S, Soggetto: quali parole fanno dell'IA, o di una tecnologia, il soggetto che agisce? Chi sparisce dalla frase?
N, Necessità: quali parole trasformano una scelta in un destino o in un obbligo?
I, Interesse: quale domanda va posta su chi parla e su che cosa vende? Non inventare l'autore se non è indicato nella frase.
Rispondi soltanto con un oggetto JSON in questa forma:
{"T":{"parole":["..."],"nota":"..."},"S":{"parole":["..."],"nota":"..."},"N":{"parole":["..."],"nota":"..."},"I":{"nota":"..."},"riscrittura":"..."}
Regole: "parole" contiene sottostringhe copiate esattamente dalla frase, brevi. Se un'operazione manca, lista vuota e una nota che lo dice. Ogni nota è una sola frase sobria, in italiano, senza enfasi. La riscrittura riformula la stessa informazione al presente, con soggetti umani, come una decisione e con l'interesse dichiarato, senza aggiungere fatti che non stanno nella frase: quando il soggetto è ignoto usa formule come «chi la vende» o «chi la costruisce».
<frase>${f}</frase>`;
async function runLive(text) {
  if (LIVE.busy) return;
  const status = document.getElementById("liveStatus"), btn = document.getElementById("liveBtn"), out = document.getElementById("liveOut");
  const setS = t => { LIVE.status = t; if (status) status.textContent = t; };
  LIVE.text = text; LIVE.res = null; if (out) out.innerHTML = "";
  let sample = null;
  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sample = null; }
  if (!sample) { setS("L'analisi dal vivo non è disponibile in questa vista: smontatela a voce, con le quattro domande."); return; }
  LIVE.busy = true; if (btn) btn.disabled = true;
  setS("Claude sta leggendo la frase…");
  try {
    const res = await sample.json(LIVE_PROMPT(text), { modelTier: "quick", cache: false });

/* --- la macchina ascolta la risposta e scrive il ponte --- */
const MQ_KEY = "sirene-genia-panel-v2";
const MQ = (() => { try { const o = JSON.parse(localStorage.getItem(MQ_KEY) || "{}"); Object.values(o).forEach(m => { m.listening = false; m.busy = false; m.status = ""; }); return o; } catch (e) { return {}; } })();
function mqSave() { try { const o = {}; Object.keys(MQ).forEach(k => { const m = MQ[k]; o[k] = { said: m.said || "", mq: m.mq || null, decision: m.decision || null, re: m.re || null }; }); localStorage.setItem(MQ_KEY, JSON.stringify(o)); } catch (e) {} }
let REC = null, REC_J = null;
function mqSet(j, patch) { MQ[j] = Object.assign(MQ[j] || {}, patch); mqSave(); const st = document.getElementById("mqStatus"); if (st && patch.status != null) st.textContent = patch.status; }
/* ferma davvero: stacca i gestori, interrompe, dimentica l'istanza */
function recHalt() {
  if (REC_J != null && MQ[REC_J]) { MQ[REC_J].wantStop = true; MQ[REC_J].listening = false; mqSave(); }
  const r = REC; REC = null; REC_J = null;
  if (r) { r.onend = null; r.onerror = null; r.onresult = null; try { r.stop(); } catch (e) {} try { r.abort(); } catch (e) {} }
}
function paintListen(on) {
  const b = document.getElementById("mqListen"); if (!b) return;
  b.classList.toggle("on", on); b.innerHTML = on ? "<b>●</b>Sto ascoltando · ferma" : "<b>○</b>Ascolta la risposta";
}
function mqListen(j) {
  const m = MQ[j] || {};
  if (m.listening || (REC && REC_J === j)) { recHalt(); paintListen(false); mqSet(j, { status: "" }); return; }
  if (REC) recHalt();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const ta0 = document.getElementById("mqText"); if (ta0) { ta0.focus(); ta0.setSelectionRange(ta0.value.length, ta0.value.length); }
  if (!SR) { mqSet(j, { status: "Il microfono non arriva a questa pagina. Usate la dettatura del Mac: il cursore è già nel riquadro, premete due volte il tasto fn (o 🌐) e parlate." }); return; }
  try {
    REC = new SR(); REC_J = j; REC.lang = "it-IT"; REC.continuous = true; REC.interimResults = true;
    let finalText = (m.said || "").trim();
    REC.onresult = ev => {
      let interim = "";
      for (let k = ev.resultIndex; k < ev.results.length; k++) { const r = ev.results[k]; if (r.isFinal) finalText = (finalText + " " + r[0].transcript).trim(); else interim += r[0].transcript; }
      MQ[j].said = finalText; MQ[j].heard = true; mqSave();
      const ta = document.getElementById("mqText"); if (ta && +ta.dataset.j === j) { ta.value = finalText + (interim ? " " + interim : ""); ta.scrollTop = ta.scrollHeight; }
    };
    REC.onerror = ev => { if (ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture") { recHalt(); paintListen(false); const t = document.getElementById("mqText"); if (t) t.focus(); mqSet(j, { status: "Il microfono non arriva a questa pagina. Usate la dettatura del Mac: il cursore è già nel riquadro, premete due volte il tasto fn (o 🌐) e parlate." }); } else if (ev.error !== "no-speech" && ev.error !== "aborted") mqSet(j, { status: "Ascolto interrotto (" + ev.error + "): si riprende da solo." }); };
    const me = REC;
    REC.onend = () => { if (REC === me && MQ[j] && MQ[j].listening && !MQ[j].wantStop) { setTimeout(() => { if (REC === me) { try { me.start(); } catch (e) {} } }, 250); } };
    REC.start();
    MQ[j] = Object.assign(MQ[j] || {}, { heard: false });
    mqSet(j, { listening: true, wantStop: false, status: "In ascolto…" }); paintListen(true);
    setTimeout(() => { if (REC === me && MQ[j] && !MQ[j].heard) { recHalt(); paintListen(false); const t = document.getElementById("mqText"); if (t) t.focus(); mqSet(j, { status: "Il microfono non arriva a questa pagina. Usate la dettatura del Mac: il cursore è già nel riquadro, premete due volte il tasto fn (o 🌐) e parlate." }); } }, 7000);
  } catch (e) { mqSet(j, { status: "Impossibile avviare il microfono: scrivete o incollate la risposta." }); }
}
function routeSummary() {
  const A = Object.values(state.votes).filter(x => x === "A").length, P = Object.values(state.votes).filter(x => x === "P").length;
  const via = state.path.via ? FORKS.via.opts.find(o => o.id === state.path.via).h : "nessuna scelta";

}
const ASK_PROMPT = (j, prev) => { const g = PANEL[j]; return `Sei un modello linguistico usato in diretta da un moderatore, Andrea Colamedici, durante un forum sull'intelligenza artificiale a Roma, davanti a duecento persone, studenti ed esperti. Formuli tu la domanda; il moderatore la leggerà, la discuterà davanti alla sala e la accetterà, la riformulerà o la rifiuterà.

Ospite a cui fare la domanda: ${g.name}. Dossier verificato: ${DOSSIER[j]}
La domanda deve stare nell'area «${TAGS[g.tag].name}: ${TAGS[g.tag].q}» e legarsi al tema del forum, la conoscenza creativa.
${prev ? `Prima di questa domanda ha parlato ${prev.name}. Trascrizione della sua risposta, dal microfono, con possibili errori di riconoscimento:
<risposta_precedente>${prev.said}</risposta_precedente>
Costruisci la domanda come un ponte: riprendi UNA cosa precisa che ${prev.name} ha detto, con le sue parole tra virgolette basse, e portala a ${g.name}.` : `È la prima domanda della sessione, subito dopo il gioco: aggancia ${g.name} a ciò che la sala ha appena fatto.`}

  state.idx = Math.max(0, Math.min(BEATS.length - 1, state.idx));
  state.max = Math.max(state.max || 0, state.idx);
  const b = BEATS[state.idx], cfg = beatCfg(b);
  document.body.dataset.v = cfg.veil;
  document.body.dataset.started = state.idx > 0 ? "1" : "0";
  document.body.dataset.bars = cfg.bars ? "1" : "0";
  document.getElementById("act").textContent = b.act || "";
  layer.classList.add("out");
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => {
    layer.innerHTML = VIEWS[b.k](b);
    layer.querySelectorAll("[data-vote]").forEach(el => el.addEventListener("click", () => vote(el.dataset.vote)));
    layer.querySelectorAll("[data-fork]").forEach(el => el.addEventListener("click", () => choose(+el.dataset.fork)));
    const sail = document.getElementById("sailBtn"); if (sail) sail.addEventListener("click", () => { initAudio(); sail.remove(); });
    const tp = document.getElementById("toPanelBtn"); if (tp) tp.addEventListener("click", () => { state.idx = actStart(5); show(); });
    const ml = document.getElementById("mqListen"); if (ml) ml.addEventListener("click", () => mqListen(+ml.dataset.j));
    const mb = document.getElementById("mqAsk"); if (mb) mb.addEventListener("click", () => runAsk(+mb.dataset.j));
    layer.querySelectorAll("[data-dec]").forEach(el => el.addEventListener("click", () => decide(BEATS[state.idx].j, el.dataset.dec)));
    const re = document.getElementById("mqRe"); if (re) setTimeout(() => re.focus(), 200);
    const mt = document.getElementById("mqText"); if (mt) mt.addEventListener("input", () => { MQ[+mt.dataset.j] = Object.assign(MQ[+mt.dataset.j] || {}, { said: mt.value }); mqSave(); });
    const form = document.getElementById("liveForm");
    if (form) {
      form.addEventListener("submit", e => { e.preventDefault(); const v = document.getElementById("liveIn").value.trim(); if (v) runLive(v); });
      if (!LIVE.res) setTimeout(() => { const inp = document.getElementById("liveIn"); if (inp) inp.focus(); }, 300);
    }
    layer.classList.remove("out");
  }, cfg.hush ? 900 : 420);
  if (GL) { GL.curText = cfg.text; GL.curTy = cfg.ty || 0; GL.setWords(cfg.text, cfg.ty || 0); GL.setKnots(knots()); if (SNAP) { GL.tp.set(GL.tt); GL.ta.set(GL.tta); } }
  document.getElementById("count").textContent = `${String(state.idx + 1).padStart(2, "0")} / ${BEATS.length}`;
  document.getElementById("hud").style.opacity = cfg.dark > .9 ? .12 : 1;
  drawRope(); renderSources(); applyAudio(false); save();
}
function vote(k) {
  const b = BEATS[state.idx];
  if (b.k !== "an" || b.st !== "frase") return;
  state.votes[b.i] = k; save();
  layer.querySelectorAll("[data-vote]").forEach(el => el.classList.toggle("on", el.dataset.vote === k));
}
function onPath(b) {
  if (!b) return false;
  if (b.k === "power" && state.path.padrone != null) return b.j === state.path.padrone;
  if (b.k === "altri") return state.path.padrone != null;
  return true;
}
function go(d) {
  if (!AU.ctx) initAudio();
  if (REC) recHalt();
  if (d > 0 && BEATS[state.idx].k === "fine") return;
  let i = state.idx + d;
  while (i >= 0 && i < BEATS.length && !onPath(BEATS[i])) i += d;
  if (i < 0 || i >= BEATS.length) return;
  state.idx = i; show();
}
function choose(n) {
  const b = BEATS[state.idx];
  if (b.k !== "bivio") return;
  const o = FORKS[b.f].opts[n]; if (!o) return;
  state.path[b.f] = o.id; save();
  layer.querySelectorAll("[data-fork]").forEach(el => el.classList.toggle("on", +el.dataset.fork === n));
  setTimeout(() => { if (BEATS[state.idx] === b) go(1); }, 900);
}
/* la mappa della traversata: le sette sirene, i tre bivi, la posizione della nave */
function routeNodes() {
  const n = [];
  BEATS.forEach((b, i) => {
    if (b.k === "circe") n.push({ i, t: "porto" });
    if (b.k === "bivio") n.push({ i, t: "bivio", f: b.f });
    if (b.k === "an" && b.st === "frase") n.push({ i, t: "sirena", s: b.i });
    if (b.k === "coppia" && b.st === "frase") { n.push({ i, t: "sirena", s: b.i }); n.push({ i, t: "sirena", s: b.i2 }); }
    if (b.k === "fine") n.push({ i, t: "porto" });
  });
  return n;
}
function routeSVG(w, h, big) {
  const nodes = routeNodes(), pad = big ? 60 : 14, y = h / 2, st = (w - pad * 2) / (nodes.length - 1);
  const x = k => pad + k * st, yy = k => y + Math.sin(k * 1.7) * (big ? 10 : 2), cur = state.idx;
  let o = `<path d="M${x(0)} ${yy(0)} ${nodes.map((_, k) => `L${x(k)} ${yy(k)}`).join(" ")}" stroke="var(--gold)" stroke-width="${big ? 2 : 1.3}" fill="none" opacity=".45"/>`;
  nodes.forEach((nd, k) => {
    const cx = x(k), cy = yy(k), done = nd.i <= state.max;
    if (nd.t === "porto") o += `<rect x="${cx - (big ? 6 : 3)}" y="${cy - (big ? 6 : 3)}" width="${big ? 12 : 6}" height="${big ? 12 : 6}" fill="${done ? "var(--gold)" : "var(--night)"}" stroke="var(--gold)" stroke-width="1.2" transform="rotate(45 ${cx} ${cy})"/>`;
    if (nd.t === "sirena") {
      const v = state.votes[nd.s], knot = rIndex(nd.s) <= state.max, col = v === "A" ? "#ff8a76" : v === "P" ? "var(--gold)" : done ? "var(--foam)" : "var(--dim)";
      o += `<circle cx="${cx}" cy="${cy}" r="${big ? (knot ? 9 : 6) : (knot ? 5 : 3.2)}" fill="${knot ? col : "var(--night)"}" stroke="${col}" stroke-width="${big ? 2 : 1.3}"><title>${SIRENS[nd.s].name}</title></circle>`;
      if (big) o += `<text x="${cx}" y="${cy + 30}" text-anchor="middle" font-family="Geist Mono, monospace" font-size="12" letter-spacing="2" fill="${col}">${SIRENS[nd.s].name.toUpperCase()}</text>`;
    }
    if (nd.t === "bivio") {
      const ch = state.path[nd.f], opts = FORKS[nd.f].opts, L = big ? 16 : 6;
      [-1, 0, 1].forEach((d, q) => { const on = ch != null && opts[q].id === ch; o += `<line x1="${cx}" y1="${cy}" x2="${cx + L * .9}" y2="${cy + d * L}" stroke="${on ? "var(--gold)" : "var(--dim)"}" stroke-width="${on ? (big ? 2.4 : 1.6) : 1}" opacity="${on || ch == null ? 1 : .35}"/>`; });
      o += `<circle cx="${cx}" cy="${cy}" r="${big ? 4 : 2}" fill="var(--gold)"/>`;
      if (big) { const lab = ch != null ? opts.find(o2 => o2.id === ch).h : "?"; o += `<text x="${cx}" y="${cy - 22}" text-anchor="middle" font-family="Geist Mono, monospace" font-size="12" letter-spacing="2" fill="var(--gold)">${esc(lab.toUpperCase())}</text>`; }
    }
  });
  let kk = 0; for (let k = 0; k < nodes.length; k++) if (nodes[k].i <= cur) kk = k;
  const frac = nodes[kk + 1] ? Math.min(1, (cur - nodes[kk].i) / Math.max(1, nodes[kk + 1].i - nodes[kk].i)) : 0;
  const px = x(kk) + (nodes[kk + 1] ? (x(kk + 1) - x(kk)) * frac : 0), py = yy(kk) - (big ? 16 : 7);
  o += `<path d="M${px} ${py} l${big ? 5 : 3} ${big ? -8 : -4} l${big ? -10 : -6} 0 z" fill="var(--foam)" opacity=".9"/>`;
  return o;
}
function drawRope() { document.getElementById("rope").innerHTML = routeSVG(300, 34, false); }
const srcBox = document.getElementById("sources");
function renderSources() {
  const b = BEATS[state.idx];
  const list = b.k === "an" ? SIRENS[b.i].fonti : b.k === "coppia" ? [...SIRENS[b.i].fonti, ...SIRENS[b.i2].fonti] : b.k === "risk" ? RISKS[riskOrder()[b.j]].fonti : b.k === "power" ? POWERS[b.j].fonti : ["tesi", "quattro", "fab", "genealogia", "title"].includes(b.k) ? THEORY_FONTI : END_FONTI;
  srcBox.innerHTML = `<div class="h">Fonti</div>` + list.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join("");
}

document.getElementById("prevBtn").addEventListener("click", () => go(-1));
document.getElementById("nextBtn").addEventListener("click", () => go(1));
document.getElementById("srcBtn").addEventListener("click", () => { srcBox.hidden = !srcBox.hidden; });
document.getElementById("projBtn").addEventListener("click", () => document.body.classList.toggle("proj"));
const muteBtn = document.getElementById("muteBtn");
function toggleMute() { AU.muted = !AU.muted; muteBtn.textContent = AU.muted ? "M audio spento" : "M audio"; if (AU.master) AU.master.gain.setTargetAtTime(AU.muted ? 0 : AU.vol, AU.ctx.currentTime, .1); }
muteBtn.addEventListener("click", () => { if (!AU.ctx) initAudio(); toggleMute(); });
document.getElementById("fsBtn").addEventListener("click", () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} });
const resetBtn = document.getElementById("resetBtn"); let armed = null;
resetBtn.addEventListener("click", () => {
  if (armed) { clearTimeout(armed); armed = null; resetBtn.textContent = "ricomincia"; state = { idx: 0, max: 0, votes: {}, path: { via: null, padrone: null, danno: null }, t0: null }; Object.keys(MQ).forEach(k => delete MQ[k]); mqSave(); LIVE.res = null; LIVE.text = ""; LIVE.status = ""; show(); return; }
  resetBtn.textContent = "conferma: ricomincia"; armed = setTimeout(() => { armed = null; resetBtn.textContent = "ricomincia"; }, 3500);
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = e.target && e.target.closest && e.target.closest("input, textarea");
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") { e.preventDefault(); go(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(-1); }
  else if (/^[1-3]$/.test(k) && BEATS[state.idx].k === "bivio") choose(+k - 1);
  else if (/^[0-6]$/.test(k)) { if (!AU.ctx) initAudio(); state.idx = k === "0" ? 0 : Math.max(0, actStart(+k - 1)); show(); }
  else if (k === "m" || k === "M") { if (!AU.ctx) initAudio(); toggleMute(); }
  else if (k === "s" || k === "S") srcBox.hidden = !srcBox.hidden;
  else if (k === "l" || k === "L") document.body.classList.toggle("proj");
  else if (k === "g" || k === "G") { if (GL) GL.post = !GL.post; }
  else if (k === "h" || k === "H") peek(!hint.classList.contains("peek"));
  else if (k === "a" || k === "A") vote("A");
  else if (k === "p" || k === "P") vote("P");
  else if (k === "f" || k === "F") document.getElementById("fsBtn").click();
  else if (k === "+" || k === "=" || k === "-" || k === "_") {
    AU.vol = Math.max(0, Math.min(1.6, AU.vol + (k === "+" || k === "=" ? .1 : -.1)));
    if (AU.master && !AU.muted) AU.master.gain.setTargetAtTime(AU.vol, AU.ctx.currentTime, .1);
    muteBtn.textContent = "M audio " + Math.round(AU.vol * 100) + "%";
  }
  wake();
});
const hint = document.getElementById("hint"); let idleT = null, peekT = null;
function wake() { hint.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => hint.classList.add("idle"), 3500); }
function peek(on) { hint.classList.toggle("peek", on); clearTimeout(peekT); if (on) peekT = setTimeout(() => hint.classList.remove("peek"), 6000); }
document.addEventListener("pointermove", e => { wake(); if (e.clientY > window.innerHeight - 36) peek(true); });
wake();

/* avvio */
(async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load('italic 400 120px "Instrument Serif"'), document.fonts.load('400 120px "Instrument Serif"')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  if (T) { try { GL = buildScene(); } catch (e) { GL = null; } }
  state.idx = Math.max(0, Math.min(BEATS.length - 1, state.idx));
  if (GL) { const c = beatCfg(BEATS[state.idx]); cam.z = c.z; cam.rise = c.rise; cam.dark = c.dark; cam.ahead = c.ahead || 0; cam.wave = c.wave == null ? 1 : c.wave; cam.moon = c.moon || 0; frame.snapAim = true; }
  else document.body.style.background = "radial-gradient(120% 80% at 50% 0%, #0f2230, #02050a 70%)";
  show();
  requestAnimationFrame(frame);
})();
</script>
