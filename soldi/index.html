<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Di soldi (non) si parla!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#003087;color:#fff;font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:clamp(1.2rem,5vw,4rem);-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:clamp(48px,7vw,92px) clamp(48px,7vw,92px)}
.box{position:relative;width:100%;max-width:640px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2.4rem,9vw,5rem);letter-spacing:-.05em;line-height:.88;margin:0 0 1.2rem}
h1 .off{color:#64CD00;font-weight:400}
.rule{height:5px;background:#64CD00;width:min(320px,70%);margin-bottom:1.3rem}
p.meta{font-size:15px;line-height:1.65;opacity:.8;margin:0 0 2rem;max-width:46ch}
form{display:flex;flex-wrap:wrap;gap:.6rem}
input{flex:1 1 220px;min-width:0;appearance:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.06);color:#fff;font:500 16px/1 inherit;padding:.95rem 1rem;border-radius:0}
input::placeholder{color:rgba(255,255,255,.5)}
input:focus{outline:2px solid #64CD00;outline-offset:0}
button{appearance:none;border:0;cursor:pointer;background:#64CD00;color:#003087;font:600 15px/1 inherit;padding:.95rem 1.6rem}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:1rem;font-size:13.5px;min-height:1.2em;color:#FFCC02;font-weight:600}
.foot{margin-top:2.4rem;font-size:12.5px;opacity:.55;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<h1>Di soldi<br><span class="off">(</span>non<span class="off">)</span> si&nbsp;parla!</h1>
<div class="rule"></div>
<p class="meta">Proposta di Tlon per il Gruppo Banca Etica. Documento riservato: inserisci la password per accedere.</p>
<form id="f" autocomplete="off">
<input id="p" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
<button id="b" type="submit">Entra</button>
</form>
<div class="msg" id="m" role="status"></div>
<p class="foot">Tlon &middot; Maura Gancitano e Andrea Colamedici<br>settembre 2026</p>
</div>
<script>
(function(){
var f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),m=document.getElementById('m'),D=null;
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
f.addEventListener('submit',async function(e){
e.preventDefault();
if(!window.crypto||!crypto.subtle){m.textContent='Apri la pagina in https per poter accedere.';return}
b.disabled=true;m.textContent='Apertura in corso...';
try{
if(!D)D=await (await fetch('p.json',{cache:'no-store'})).json();
var enc=new TextEncoder();
var base=await crypto.subtle.importKey('raw',enc.encode(p.value),{name:'PBKDF2'},false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
var html;
if(D.z){
if(typeof DecompressionStream==='undefined'){m.textContent='Browser non supportato: usa una versione aggiornata di Chrome, Safari o Firefox.';b.disabled=false;return}
html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}else{html=new TextDecoder().decode(plain)}
document.open();document.write(html);document.close();
}catch(err){b.disabled=false;m.textContent='Password non valida.';p.select()}
});
p.focus();
})();
</script>
</body>
</html>
