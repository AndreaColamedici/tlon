<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EIPAI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1430B8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--blue:#1430B8;--blue-deep:#0E2187;--white:#FFFFFF;--ink:#10152E;--yellow:#FFE500;--font:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--blue);color:var(--white);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;min-height:100svh}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;height:72px;border-bottom:3px solid rgba(255,255,255,.25)}
.logo{display:flex;align-items:center;gap:12px;font-stretch:125%;font-weight:900;font-size:24px;letter-spacing:-.03em}
.logo i{display:block;width:14px;height:14px;background:var(--yellow)}
.logo b{color:var(--yellow);font-weight:900}
main .wrap{display:grid;gap:40px;padding-block:clamp(48px,8vw,112px)}
@media (min-width:900px){ main .wrap{grid-template-columns:7fr 5fr;gap:72px;align-items:end} }
h1{margin:0;font-stretch:125%;font-weight:900;font-size:clamp(40px,7vw,96px);letter-spacing:-.035em;line-height:.92;text-wrap:balance;overflow-wrap:anywhere}
h1 span{background:var(--yellow);color:var(--ink);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lead{margin:28px 0 0;font-size:clamp(18px,1.6vw,22px);color:rgba(255,255,255,.78);max-width:30em}
form{display:grid;gap:14px}
label{display:grid;gap:8px;font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
input{appearance:none;width:100%;min-width:0;background:var(--white);border:2px solid var(--white);color:var(--ink);padding:16px 18px;font:19px var(--font);letter-spacing:.04em}
input:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
button{appearance:none;font-family:inherit;font-weight:700;font-size:17px;line-height:1;padding:18px 26px;border:2px solid var(--yellow);background:var(--yellow);color:var(--ink);cursor:pointer}
button:hover{background:#FFEF5C;border-color:#FFEF5C}
button:disabled{opacity:.6;cursor:default}
.esito{min-height:1.5em;font-size:15px;color:rgba(255,255,255,.75)}
.esito.male{color:var(--yellow);font-weight:600}
footer .wrap{padding-block:28px;border-top:3px solid rgba(255,255,255,.25);font-size:14px;color:rgba(255,255,255,.65)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap"><span class="logo"><i aria-hidden="true"></i><span>EI<b>P</b>AI</span></span></div></header>
<main>
  <div class="wrap">
    <div>
      <h1>Una pagina <span>riservata.</span></h1>
      <p class="lead">Il sito di EIPAI è in lavorazione. Se avete ricevuto la password, inseritela per aprirlo.</p>
    </div>
    <form id="modulo" autocomplete="off">
      <label>Password<input id="chiave" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required></label>
      <button type="submit" id="entra">Aprite la pagina</button>
      <div class="esito" id="esito" aria-live="polite"></div>
    </form>
  </div>
</main>
<footer><div class="wrap">© 2026 EIPAI, European Institute for Practical AI</div></footer>
<script>
(function(){
  "use strict";
  var PARTI = ["p1.txt","p2.txt"];
  var modulo = document.getElementById("modulo");
  var campo = document.getElementById("chiave");
  var bottone = document.getElementById("entra");
  var esito = document.getElementById("esito");
  var cifrato = null, sale = null, iv = null;
  function byte(b64){ var g = atob(b64.replace(/\s+/g,"")); var a = new Uint8Array(g.length); for(var i=0;i<g.length;i++) a[i]=g.charCodeAt(i); return a; }
  function messaggio(t, male){ esito.textContent = t; esito.className = male ? "esito male" : "esito"; }
  function prendi(f){ return fetch(f,{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("fetch"); return r.text(); }); }
  Promise.all([prendi("meta.txt")].concat(PARTI.map(prendi))).then(function(tutto){
    var m = tutto[0].trim().split(":"); sale = byte(m[0]); iv = byte(m[1]);
    cifrato = byte(tutto.slice(1).map(function(p){ return p.replace(/\s+/g,""); }).join(""));
  }).catch(function(){ messaggio("La pagina non si è caricata. Ricaricate tra un minuto.", true); });
  function apri(){
    if(!cifrato){ messaggio("La pagina si sta ancora caricando. Riprovate tra un istante.", true); return; }
    var pw = campo.value; if(!pw){ campo.focus(); return; }
    bottone.disabled = true; messaggio("Apertura in corso");
    var enc = new TextEncoder();
    crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function(base){ return crypto.subtle.deriveKey({name:"PBKDF2", salt:sale, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]); })
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, k, cifrato); })
      .then(function(c){ if(typeof DecompressionStream === "undefined") throw new Error("browser"); return new Response(new Blob([c]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); })
      .then(function(html){ document.open(); document.write(html); document.close(); })
      .catch(function(e){
        bottone.disabled = false;
        if(e && e.message === "browser") messaggio("Questo browser non apre la pagina. Usate Chrome, Safari o Firefox aggiornati.", true);
        else { messaggio("Password non valida. Controllate maiuscole e minuscole e riprovate.", true); campo.select(); }
      });
  }
  modulo.addEventListener("submit", function(e){ e.preventDefault(); apri(); });
})();
</script>
</body>
</html>
