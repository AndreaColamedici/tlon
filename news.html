<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News — Tlon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bianco: #ffffff;
            --nero: #0a0a0a;
            --ottanio: #2a6b6b;
            --ottanio-scuro: #1a4848;
            --ottanio-light: #3a8b8b;
            --grigio: #6b6b6b;
            --grigio-chiaro: #e5e5e5;
            --crema: #f8f6f3;
            --conferenza: #2a6b6b;
            --festival: #c4763a;
            --corso: #3a5a8b;
            --presentazione: #7a4a9b;
            --media: #9b3a6a;
            --viaggio: #3a8b5a;
            --libro: #6a8b3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--nero); color: var(--bianco); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        ::selection { background: var(--ottanio); color: var(--bianco); }
        a { color: inherit; text-decoration: none; }
