<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page under maintenance – Tlon</title>
    <meta http-equiv="refresh" content="5;url=./en.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bianco: #ffffff;
            --nero: #0a0a0a;
            --ottanio: #2a6b6b;
            --grigio: #6b6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bianco);
            color: var(--nero);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .logo {
            margin-bottom: 3rem;
        }

        .logo img {
            height: 32px;
            width: auto;
        }

        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        h1 em {
            font-style: italic;
        }

        p {
            font-size: 1.1rem;
            color: var(--grigio);
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        a.back {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 1px solid var(--nero);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--nero);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        a.back:hover {
            background: var(--nero);
            color: var(--bianco);
        }

        .countdown {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--grigio);
        }
    </style>
</head>
<body>
    <a href="./en.html" class="logo"><img src="./assets/images/logo-tlon.png" alt="Tlon"></a>
    <h1>Page under <em>maintenance</em></h1>
    <p>This section is temporarily unavailable. We are working to make it even better.</p>
    <a href="./en.html" class="back">Back to homepage</a>
    <p class="countdown">Automatic redirect in a few seconds...</p>
</body>
</html>
