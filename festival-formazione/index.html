<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festival internazionale della formazione di Torino</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
  :root{
    --notte:#0B1A2E; --avorio:#F2EEE6; --avorio-2:rgba(242,238,230,.76);
    --oro:#CDA868; --oro-chiaro:#E0C48E; --filo-notte:rgba(242,238,230,.16);
    --display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
    --testo:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--notte)}
  body{color:var(--avorio);font-family:var(--testo);font-optical-sizing:auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .porta{
    position:relative;isolation:isolate;overflow:hidden;
    min-height:100vh;min-height:100svh;
    display:grid;grid-template-rows:auto 1fr auto auto;
    background:
      radial-gradient(90% 80% at 12% 112%, #142B4C 0%, rgba(20,43,76,0) 62%),
      var(--notte);
  }
  .fioritura{position:absolute;left:0;top:0;z-index:0;pointer-events:none}
  .velo{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg, rgba(11,26,46,.94) 0%, rgba(11,26,46,.74) 30%, rgba(11,26,46,.22) 55%, rgba(11,26,46,0) 70%);
  }
  .avvolgi{position:relative;z-index:2;width:min(100% - 2.5rem, 84rem);margin-inline:auto;transition:opacity .6s ease}
  .aperta .avvolgi{opacity:0}

  .testata,.piede{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.35rem 2rem;font-size:.9375rem;line-height:1.4;color:var(--avorio-2)}
  .testata{padding-block:clamp(1.25rem,3vw,2.1rem) .95rem;border-bottom:1px solid var(--filo-notte)}
  .piede{padding-block:1rem clamp(1.25rem,3vw,1.9rem);border-top:1px solid var(--filo-notte);font-size:.875rem}
  .apertura{align-self:end;padding-block:clamp(3rem,9vh,6rem) clamp(2.5rem,7vh,4.5rem);text-shadow:0 0 1.4rem rgba(11,26,46,.85),0 0 .35rem rgba(11,26,46,.6)}

  h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,1rem + 4.6vw,6rem);line-height:1;letter-spacing:-.018em}
  h1 span{display:block}
  .claim{margin:clamp(1rem,2vw,1.5rem) 0 0;font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(1.3rem,1rem + 1.2vw,2.2rem);line-height:1.15;color:var(--oro)}

  .modulo{margin-top:clamp(2.25rem,5vw,3.25rem);max-width:31rem}
  label{display:block;font-style:italic;font-size:1rem;color:var(--avorio-2);margin-bottom:.4rem}
  .campo{display:flex;flex-wrap:wrap;gap:.9rem 1.1rem;align-items:center}
  input{flex:1 1 13rem;min-width:0;font:inherit;font-size:1.125rem;padding:.65rem 0;color:var(--avorio);background:transparent;border:0;border-bottom:1px solid rgba(242,238,230,.42);border-radius:0;transition:border-color .25s ease}
  input:focus{outline:0;border-bottom-color:var(--oro)}
  button{font:inherit;font-size:1.0625rem;padding:.7rem 1.6rem;color:var(--notte);background:var(--oro);border:0;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s ease}
  button:hover{background:var(--oro-chiaro)}
  button:focus-visible{outline:2px solid var(--avorio);outline-offset:3px}
  button:disabled{opacity:.55;cursor:default}
  .esito{margin:.9rem 0 0;font-size:.9375rem;min-height:1.4em;color:var(--avorio-2)}
  .esito.male{color:#F2B8AE}

  @media (max-width:45rem){
    .velo{background:linear-gradient(0deg, rgba(11,26,46,.97) 0%, rgba(11,26,46,.92) 50%, rgba(11,26,46,.4) 68%, rgba(11,26,46,0) 84%)}
  }
  @media (prefers-reduced-motion:reduce){.avvolgi{transition:none}}
</style>
</head>
<body>
<main class="porta">
  <div class="velo" aria-hidden="true"></div>
  <div class="testata avvolgi">
    <span>Torino, autunno 2027</span>
    <span>Dossier di progetto riservato</span>
  </div>
  <div class="apertura avvolgi">
    <h1><span>Festival internazionale</span> <span>della formazione</span> <span>di Torino</span></h1>
    <p class="claim">Formare chi forma, educare tutti alla formazione.</p>
    <form class="modulo" id="modulo" novalidate>
      <label for="chiave">Password del dossier</label>
      <div class="campo">
        <input id="chiave" type="password" autocomplete="current-password" autofocus required>
        <button id="entra" type="submit">Apri il dossier</button>
      </div>
      <p class="esito" id="esito" role="status"></p>
    </form>
  </div>
  <div class="piede avvolgi">
    <span>Promosso da ENGIM, in dialogo con il Centro internazionale di formazione dell'OIL e la Fondazione europea per la formazione</span>
    <span>Curatela di Tlon</span>
  </div>
</main>

<script>
/* Fioritura. Migliaia di punti disposti secondo l'angolo aureo, la regola con cui
   crescono i semi del girasole: ogni punto una persona, insieme un fiore più
   grande dello schermo. Il fiore cresce dal centro la prima volta che entra in
   vista; il puntatore apre un varco che si richiude; lo scorrimento, se
   richiesto, lo fa ruotare e schiudere. Con il movimento ridotto il fiore
   compare intero e fermo. */
function Fioritura(campo, opz) {
  "use strict";
  opz = opz || {};
  var fermo = !!opz.fermo;
  var scorre = opz.scorre !== false;
  var canvas = document.createElement("canvas");
  canvas.className = "fioritura";
  canvas.setAttribute("aria-hidden", "true");
  var ctx = canvas.getContext && canvas.getContext("2d");
  if (!ctx || !window.Path2D) return null;
  campo.insertBefore(canvas, campo.firstChild);

  var AUREO = Math.PI * (3 - Math.sqrt(5));
  var LIVELLI = 7;
  var W = 1, H = 1, dpr = 1, piccolo = false;
  var punti = [], N = 0, cx = 0, cy = 0, raggio = 1, riduzione = 1;
  var t0 = 0, raf = 0, vivo = true, visibile = true;
  var mx = -1e5, my = -1e5, schiusa = 0, apertura = 0;

  function semina() {
    var r = campo.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    piccolo = W < 720;
    var c = opz.centro ? opz.centro(W, H, piccolo) : [W * 0.7, H * 0.5];
    cx = c[0]; cy = c[1];
    raggio = opz.raggio ? opz.raggio(W, H, piccolo) : Math.max(W, H) * 0.6;
    var base = opz.punti ? opz.punti(piccolo) : (piccolo ? 900 : 1700);
    N = Math.round(base * riduzione);
    /* il passo tra un seme e l'altro è costante; i semi crescono verso il bordo
       finché le spirali si leggono, e la luce cala dal centro verso fuori */
    var passo = raggio / Math.sqrt(N);
    punti = new Array(N);
    for (var n = 0; n < N; n++) {
      var q = n / N;
      punti[n] = {
        r: passo * Math.sqrt(n + 0.5),
        a: n * AUREO,
        s: passo * (0.16 + 0.17 * Math.pow(q, 0.7)),
        al: 0.14 + 0.8 * Math.pow(1 - q, 1.5),
        oro: (n % 34 === 0) || (n % 55 === 0),
        dx: 0, dy: 0, vx: 0, vy: 0
      };
    }
  }

  function disegna(ora, statico) {
    var t = t0 ? ora - t0 : 0, i, n, p;
    ctx.clearRect(0, 0, W, H);
    var crescita = statico ? 1 : Math.min(1, t / 2800);
    var visibili = statico ? N : Math.floor(N * (1 - Math.pow(1 - crescita, 3)));
    var rotazione = statico ? 0 : t * 0.000022 + schiusa * 0.9;
    var scala = 1 + schiusa * 0.18 + (statico ? 0 : Math.sin(t * 0.0006) * 0.006);
    var aperta = apertura ? Math.min(1, (ora - apertura) / 900) : 0;
    aperta = aperta * aperta * (3 - 2 * aperta);
    /* un alone dorato al centro, che cresce con il fiore */
    var alone = ctx.createRadialGradient(cx, cy, 0, cx, cy, raggio * 0.6 * scala);
    alone.addColorStop(0, "rgba(205,168,104," + (0.17 * crescita * (1 - aperta)).toFixed(3) + ")");
    alone.addColorStop(1, "rgba(205,168,104,0)");
    ctx.fillStyle = alone;
    ctx.fillRect(0, 0, W, H);
    var vie = [];
    for (i = 0; i < LIVELLI; i++) vie.push(new Path2D());
    var oro = new Path2D();
    var R = piccolo ? 70 : 125, R2 = R * R;

    for (n = 0; n < visibili; n++) {
      p = punti[n];
      var ang = p.a + rotazione, rr = p.r * scala * (1 + aperta * 1.6);
      var x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
      if (!statico) {
        var ex = x - mx, ey = y - my, e2 = ex * ex + ey * ey, tx = 0, ty = 0;
        if (e2 < R2) {
          var e = Math.sqrt(e2) || 1, f = 1 - e / R;
          f = f * f * R * 0.55; tx = ex / e * f; ty = ey / e * f;
        }
        p.vx = (p.vx + (tx - p.dx) * 0.09) * 0.82;
        p.vy = (p.vy + (ty - p.dy) * 0.09) * 0.82;
        p.dx += p.vx; p.dy += p.vy;
        x += p.dx; y += p.dy;
      }
      if (x < -8 || x > W + 8 || y < -8 || y > H + 8) continue;
      var fronte = statico ? 1 : Math.min(1, (visibili - n) / 140);
      var s = p.s * (0.35 + 0.65 * fronte);
      var a = p.al * fronte * (1 - aperta);
      if (p.oro) {
        oro.moveTo(x + s + 0.5, y); oro.arc(x, y, s + 0.5, 0, 6.2832);
      } else {
        var li = Math.min(LIVELLI - 1, Math.floor(a * LIVELLI));
        vie[li].moveTo(x + s, y); vie[li].arc(x, y, s, 0, 6.2832);
      }
    }
    for (i = 0; i < LIVELLI; i++) {
      ctx.fillStyle = "rgba(242,238,230," + ((i + 0.5) / LIVELLI).toFixed(3) + ")";
      ctx.fill(vie[i]);
    }
    ctx.fillStyle = "rgba(205,168,104," + (0.95 * (1 - aperta)).toFixed(3) + ")";
    ctx.fill(oro);
  }

  /* se i primi novanta fotogrammi arrivano lenti, il campo si dirada */
  var campioni = 0, somma = 0, ultimo = 0, misurato = false;
  function ciclo(ora) {
    raf = 0;
    if (!vivo) return;
    if (!t0) t0 = ora;
    if (!misurato && ultimo) {
      var dt = ora - ultimo;
      if (dt < 200) { somma += dt; campioni++; }
      if (campioni >= 90) {
        misurato = true;
        if (somma / campioni > 24) { riduzione = 0.62; semina(); }
      }
    }
    ultimo = ora;
    disegna(ora, false);
    if (visibile && !document.hidden) raf = requestAnimationFrame(ciclo);
  }
  function riparti() {
    if (!fermo && vivo && !raf && visibile && !document.hidden) { ultimo = 0; raf = requestAnimationFrame(ciclo); }
  }
  function suPuntatore(e) { var r = campo.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; }
  function fuori() { mx = my = -1e5; }
  function suScorrimento() { schiusa = Math.max(0, Math.min(1, (window.scrollY || 0) / (H * 0.9))); }
  var attesa = 0, ultimaW = 0, ultimaH = 0;
  function suRidimensiona() {
    clearTimeout(attesa);
    attesa = setTimeout(function () {
      if (!vivo) return;
      var r = campo.getBoundingClientRect();
      if (Math.round(r.width) === ultimaW && Math.round(r.height) === ultimaH) return;
      ultimaW = Math.round(r.width); ultimaH = Math.round(r.height);
      semina();
      if (fermo) disegna(0, true);
      else if (!raf) disegna(performance.now(), false);
    }, 160);
  }
  function suVisibilita() { if (!document.hidden) riparti(); }
  var osservatore = "IntersectionObserver" in window
    ? new IntersectionObserver(function (v) { visibile = v[v.length - 1].isIntersecting; riparti(); })
    : null;
  var misuratore = "ResizeObserver" in window ? new ResizeObserver(suRidimensiona) : null;

  semina();
  ultimaW = W; ultimaH = H;
  if (misuratore) misuratore.observe(campo);
  else window.addEventListener("resize", suRidimensiona);
  if (fermo) {
    disegna(0, true);
  } else {
    campo.addEventListener("pointermove", suPuntatore, { passive: true });
    campo.addEventListener("pointerleave", fuori);
    if (scorre) window.addEventListener("scroll", suScorrimento, { passive: true });
    document.addEventListener("visibilitychange", suVisibilita);
    if (osservatore) { visibile = false; osservatore.observe(campo); }
    else riparti();
  }

  return {
    apri: function () { apertura = performance.now(); },
    ridisegna: function () { if (!vivo) return; semina(); if (fermo) disegna(0, true); },
    ferma: function () {
      vivo = false;
      if (raf) cancelAnimationFrame(raf);
      clearTimeout(attesa);
      if (misuratore) misuratore.disconnect();
      window.removeEventListener("resize", suRidimensiona);
      window.removeEventListener("scroll", suScorrimento);
      document.removeEventListener("visibilitychange", suVisibilita);
      if (osservatore) osservatore.disconnect();
    }
  };
}

</script>
<script>
(function(){
  "use strict";
  var fermo = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var porta = document.querySelector(".porta");
  var primaRiga = document.querySelector("h1 span");
  function destraDelTitolo(){
    if(!primaRiga || !document.createRange) return 0;
    var tratto = document.createRange();
    tratto.selectNodeContents(primaRiga);
    return tratto.getBoundingClientRect().right;
  }
  var fiore = window.Fioritura ? Fioritura(porta, {
    fermo: fermo,
    centro: function(W, H, piccolo){
      if(piccolo) return [W * 0.62, H * 0.2];
      return [Math.max(W * 0.715, destraDelTitolo() + W * 0.09), H * 0.47];
    },
    raggio: function(W, H, piccolo){ return Math.max(W, H) * (piccolo ? 0.34 : 0.43); }
  }) : null;
  if(fiore && document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fiore.ridisegna(); });

  var PARTI = ["p1.txt","p2.txt","p3.txt","p4.txt"];
  var modulo = document.getElementById("modulo");
  var campo = document.getElementById("chiave");
  var bottone = document.getElementById("entra");
  var esito = document.getElementById("esito");
  var cifrato = null, sale = null, iv = null;

  function byte(b64){
    var grezzo = atob(b64.replace(/\s+/g, ""));
    var a = new Uint8Array(grezzo.length);
    for(var i = 0; i < grezzo.length; i++) a[i] = grezzo.charCodeAt(i);
    return a;
  }
  function messaggio(testo, male){
    esito.textContent = testo;
    esito.className = male ? "esito male" : "esito";
  }
  function prendi(f){
    return fetch(f, {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("fetch");
      return r.text();
    });
  }

  Promise.all([prendi("meta.txt")].concat(PARTI.map(prendi)))
    .then(function(tutto){
      var m = tutto[0].trim().split(":");
      sale = byte(m[0]);
      iv = byte(m[1]);
      cifrato = byte(tutto.slice(1).map(function(p){ return p.replace(/\s+/g, ""); }).join(""));
    })
    .catch(function(){
      messaggio("Il documento non si è caricato. Ricarica la pagina tra un minuto.", true);
    });

  function scrivi(html){
    if(fiore) fiore.ferma();
    document.open();
    document.write(html);
    document.close();
  }

  function apri(){
    if(!cifrato){ messaggio("Il documento si sta ancora caricando. Riprova tra un istante.", true); return; }
    var pw = campo.value;
    if(!pw){ campo.focus(); return; }
    bottone.disabled = true;
    messaggio("Apertura in corso");
    var enc = new TextEncoder();
    crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:sale, iterations:200000, hash:"SHA-256"},
          base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      })
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, k, cifrato); })
      .then(function(compresso){
        if(typeof DecompressionStream === "undefined"){ throw new Error("browser"); }
        var flusso = new Blob([compresso]).stream().pipeThrough(new DecompressionStream("gzip"));
        return new Response(flusso).text();
      })
      .then(function(html){
        if(fiore && !fermo){
          fiore.apri();
          porta.classList.add("aperta");
          setTimeout(function(){ scrivi(html); }, 850);
        } else {
          scrivi(html);
        }
      })
      .catch(function(e){
        bottone.disabled = false;
        if(e && e.message === "browser"){
          messaggio("Questo browser non apre il dossier. Usa Chrome, Safari o Firefox aggiornati.", true);
        } else {
          messaggio("Password non valida. Controlla maiuscole e minuscole e riprova.", true);
          campo.select();
        }
      });
  }

  modulo.addEventListener("submit", function(e){ e.preventDefault(); apri(); });
})();
</script>
</body>
</html>
