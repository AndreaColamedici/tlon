<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cimiterologia — Tlon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bianco: #ffffff;
            --nero: #2d3a35;
            --ottanio: #3d8b8b;
            --verde-salvia: #7a9e8e;
            --verde-acqua: #a8c5b8;
            --verde-pallido: #e8f2ed;
            --verde-chiaro: #f2f7f4;
            --grigio: #8a9a92;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bianco);
            color: var(--nero);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }
        ::selection { background: var(--verde-acqua); color: var(--nero); }
        a { color: inherit; text-decoration: none; }

        header { position: fixed; top: 0; left: 0; right: 0; z-index: 1002; padding: 1.5rem 3rem; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); }
        .logo { display: flex; align-items: center; }
        .logo img { height: 26px; width: auto; }
        nav { display: flex; gap: 2.5rem; align-items: center; }
        nav a { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grigio); transition: color 0.3s ease; }
        nav a:hover { color: var(--ottanio); }
        .lang-switch { display: flex; gap: 0.75rem; align-items: center; margin-left: 2rem; padding-left: 2rem; border-left: 1px solid var(--verde-pallido); }
        .lang-switch a { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grigio); }
        .lang-switch a.active { color: var(--ottanio); }

        .hamburger { display: none; flex-direction: column; width: 32px; height: 32px; cursor: pointer; z-index: 1003; background: none; border: none; justify-content: center; align-items: center; }
        .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--nero); margin: 3px 0; transition: all 0.3s ease; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -5px); }

        .mobile-menu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bianco); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; gap: 1.5rem; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease; }
        .mobile-menu.active { opacity: 1; visibility: visible; }
        .mobile-menu a { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: var(--nero); }
        .mobile-menu a:hover { color: var(--ottanio); }

        /* Atmosfera luminosa */
        .atmosphere { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        
        .cypress { position: absolute; bottom: 0; width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 380px solid var(--verde-pallido); opacity: 0.6; filter: blur(1px); animation: cypressSway 12s ease-in-out infinite; transform-origin: bottom center; }
        .cypress-1 { left: 3%; opacity: 0.5; transform: scale(1); }
        .cypress-2 { left: 7%; opacity: 0.4; transform: scale(0.85); }
        .cypress-3 { right: 4%; opacity: 0.5; transform: scale(0.95); }
        .cypress-4 { right: 9%; opacity: 0.35; transform: scale(0.8); }
        @keyframes cypressSway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(0.5deg); } }

        .piramide { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-bottom: 220px solid var(--verde-pallido); opacity: 0.5; }

        .candles-container { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); display: flex; gap: 100px; opacity: 0.7; }
        .candle { position: relative; width: 8px; height: 40px; background: linear-gradient(180deg, #f5efe6 0%, #e8dcc8 100%); border-radius: 3px 3px 0 0; }
        .flame { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 8px; height: 18px; background: linear-gradient(180deg, rgba(255, 245, 200, 0.9) 0%, rgba(255, 200, 120, 0.7) 50%, rgba(255, 160, 80, 0.5) 100%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: flameFlicker 0.5s ease-in-out infinite alternate; }
        @keyframes flameFlicker { 0% { transform: translateX(-50%) scaleY(1) rotate(-1deg); } 100% { transform: translateX(-50%) scaleY(1.1) rotate(1deg); } }

        main { position: relative; z-index: 1; padding-top: 80px; }
        
        .hero { min-height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 5rem 3rem; background: transparent; }
        .hero-content { max-width: 800px; }
        .hero-label { display: inline-flex; align-items: center; gap: 1rem; font-size: 0.65rem; font-weight: 400; letter-spacing: 0.5em; text-transform: uppercase; color: var(--verde-salvia); margin-bottom: 2.5rem; }
        .hero-title { font-family: 'Instrument Serif', serif; font-size: clamp(3.5rem, 10vw, 7rem); font-weight: 400; font-style: italic; line-height: 1; color: var(--verde-salvia); margin-bottom: 1.5rem; letter-spacing: -0.02em; }
        .hero-subtitle { font-family: 'Instrument Serif', serif; font-size: clamp(1.1rem, 2.5vw, 1.4rem); font-style: italic; color: var(--grigio); font-weight: 400; }

        .content-section { padding: 5rem 3rem; max-width: 1100px; margin: 0 auto; background: rgba(255,255,255,0.85); }
        .content-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 5rem; align-items: start; }
        .content-text { display: flex; flex-direction: column; gap: 1.75rem; }
        .content-intro { font-size: 1.1rem; line-height: 1.95; color: var(--nero); font-weight: 400; }
        .content-intro strong { color: var(--ottanio); font-weight: 500; }
        .content-desc { font-size: 1rem; line-height: 1.9; color: var(--grigio); }
        .content-desc em { font-style: italic; color: var(--nero); }

        .details-sidebar { display: flex; flex-direction: column; gap: 1rem; position: sticky; top: 110px; }
        .detail-card { background: var(--bianco); border: 1px solid var(--verde-pallido); padding: 1.5rem; display: flex; align-items: flex-start; gap: 1rem; border-radius: 8px; }
        .detail-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--verde-chiaro); border-radius: 50%; }
        .detail-icon svg { width: 20px; height: 20px; stroke: var(--verde-salvia); }
        .detail-content { display: flex; flex-direction: column; gap: 0.3rem; }
        .detail-label { font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--grigio); }
        .detail-value { font-family: 'Instrument Serif', serif; font-size: 1.1rem; font-style: italic; color: var(--nero); }
        .detail-note { font-size: 0.78rem; color: var(--grigio); }
        .date-card .detail-value { font-size: 1rem; line-height: 1.65; }

        .illustri-section { padding: 5rem 3rem; text-align: center; background: rgba(255,255,255,0.9); }
        .illustri-label { font-size: 0.6rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--grigio); margin-bottom: 2.5rem; }
        .illustri-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 2rem; max-width: 850px; margin: 0 auto; }
        .illustre-item { padding: 0.6rem 0; }
        .illustre-name { font-family: 'Instrument Serif', serif; font-size: 1.15rem; font-style: italic; color: var(--verde-acqua); transition: color 0.3s ease; }
        .illustre-name:hover { color: var(--ottanio); }
        .illustre-item.legend .illustre-name { font-size: 1.7rem; color: var(--verde-salvia); }
        .illustre-item.featured .illustre-name { font-size: 1.4rem; color: var(--verde-salvia); opacity: 0.8; }

        .quote-section { padding: 5rem 3rem; text-align: center; background: var(--verde-chiaro); }
        .quote-container { max-width: 680px; margin: 0 auto; }
        .quote-text { font-family: 'Instrument Serif', serif; font-size: clamp(1.3rem, 3vw, 1.9rem); font-style: italic; line-height: 1.6; color: var(--nero); font-weight: 400; }
        .quote-mark { font-size: 3rem; color: var(--verde-acqua); line-height: 0; vertical-align: top; }
        .quote-author { margin-top: 1.5rem; font-size: 0.8rem; letter-spacing: 0.12em; color: var(--verde-salvia); }

        .cta-section { padding: 5rem 3rem 6rem; text-align: center; background: var(--bianco); }
        .cta-container { max-width: 500px; margin: 0 auto; }
        .cta-label { font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--grigio); margin-bottom: 1.25rem; }
        .cta-title { font-family: 'Instrument Serif', serif; font-size: clamp(1.6rem, 3.5vw, 2.2rem); color: var(--nero); margin-bottom: 0.75rem; font-weight: 400; }
        .cta-title em { font-style: italic; color: var(--ottanio); }
        .cta-desc { font-size: 0.95rem; line-height: 1.75; color: var(--grigio); margin-bottom: 1.25rem; }
        .cta-btn { display: inline-block; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--bianco); background: var(--verde-salvia); padding: 1rem 2.5rem; border-radius: 6px; transition: all 0.3s ease; }
        .cta-btn:hover { background: var(--ottanio); }
        .cta-posti { display: block; margin-top: 0.75rem; font-size: 0.75rem; color: var(--grigio); letter-spacing: 0.05em; }

        footer { background: var(--nero); color: var(--bianco); padding: 3.5rem 3rem 1.5rem; position: relative; z-index: 1; }
        .footer-grid { display: flex; justify-content: space-between; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 2.5rem; }
        .footer-brand { font-family: 'Instrument Serif', serif; font-size: 1.3rem; margin-bottom: 0.4rem; }
        .footer-tagline { font-size: 0.8rem; color: rgba(255,255,255,0.45); }
        .footer-links { display: flex; gap: 4rem; }
        .footer-col h4 { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 1.25rem; color: rgba(255,255,255,0.35); }
        .footer-col a { display: block; font-size: 0.85rem; margin-bottom: 0.6rem; color: rgba(255,255,255,0.55); transition: color 0.3s ease; }
        .footer-col a:hover { color: var(--bianco); }
