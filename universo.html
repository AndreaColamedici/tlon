<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Tlon</title>
    <meta name="description" content="Tlon">
    <link rel="canonical" href="https://www.tlon.it/universo.html">
    <link rel="alternate" hreflang="it" href="https://www.tlon.it/universo.html">
    <link rel="alternate" hreflang="x-default" href="https://www.tlon.it/universo.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tlon">
    <meta property="og:locale" content="it_IT">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:title" content="Tlon">
    <meta property="og:description" content="Tlon">
    <meta property="og:url" content="https://www.tlon.it/universo.html">
    <meta property="og:image" content="https://www.tlon.it/assets/images/og-tlon.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tlon">
    <meta name="twitter:description" content="Tlon">
    <meta name="twitter:image" content="https://www.tlon.it/assets/images/og-tlon.png">
    <style>
        @import url('/assets/fonts/fonts.css');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* le dimensioni in HTML servono a evitare il salto del layout: qui
           si preserva il rapporto d'aspetto quando la larghezza è fluida */
        img { height: auto; }

        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Instrument Serif', serif;
        }

        #world {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .letter {
            position: absolute;
            font-size: 20vw;
            color: #fff;
            cursor: default;
            user-select: none;
            transition: color 0.3s;
            z-index: 10;
        }

        .letter:hover {
            color: #2a6b6b;
        }

        .floating-word {
            position: absolute;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.15);
            font-style: italic;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .floating-word.awake {
            color: rgba(42, 107, 107, 0.8);
            font-size: 1.5rem;
        }

        #blob {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(42,107,107,0.4) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(40px);
            z-index: 1;
            mix-blend-mode: screen;
        }

        #gravity-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.2);
            text-transform: uppercase;
            z-index: 100;
        }

        #portal {
            position: fixed;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a6b6b 0%, transparent 70%);
            opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 5;
        }

        #portal.open {
            bottom: -100px;
            opacity: 0.6;
        }

        #portal-text {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 100;
            text-decoration: none;
        }

        #portal-text:hover {
            color: #2a6b6b;
        }

        .crumb {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #2a6b6b;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
        }

        #secret {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-style: italic;
            color: #2a6b6b;
            opacity: 0;
            pointer-events: none;
            text-align: center;
            line-height: 1.6;
            max-width: 600px;
            z-index: 200;
            transition: opacity 0.5s;
        }

        #breath {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vmax;
            height: 100vmax;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(42,107,107,0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.1; }
        }

        #instructions {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            z-index: 100;
            text-align: center;
        }

        #corner-home {
            position: fixed;
            top: 2rem;
            left: 2rem;
            font-size: 1rem;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            z-index: 100;
            transition: color 0.3s;
        }

        #corner-home:hover {
            color: #2a6b6b;
        }

        .ripple {
            position: absolute;
            border: 1px solid rgba(42,107,107,0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: ripple-out 1s ease-out forwards;
        }

        @keyframes ripple-out {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        #time-display {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.15);
            font-family: monospace;
            z-index: 100;
        }
    
        /* Rispetta la preferenza di sistema per il movimento ridotto:
           orbite, particelle, parallasse e reveal diventano istantanei. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
            .reveal { opacity: 1 !important; transform: none !important; }
        }
</style>
</head>
<body>
    <a href="./" id="corner-home">←</a>
    <div id="instructions">Muovi. Clicca. Aspetta. Gioca.</div>
    <div id="world"></div>
    <div id="blob"></div>
    <div id="breath"></div>
    <div id="portal"></div>
    <a href="./il-progetto.html" id="portal-text">Entra</a>
    <div id="secret"></div>
    <div id="time-display"></div>

    <script>
    const world = document.getElementById('world');
    const blob = document.getElementById('blob');
    const portal = document.getElementById('portal');
    const portalText = document.getElementById('portal-text');
    const secret = document.getElementById('secret');
    const timeDisplay = document.getElementById('time-display');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let blobX = mouseX;
    let blobY = mouseY;
    let gravity = { x: 0, y: 0.5 };
    let lettersCaught = 0;
    let idleTime = 0;
    let lastMove = Date.now();
    let crumbs = [];
    let sessionStart = Date.now();

    // ═══════════════════════════════════════════════════════════
    // LE LETTERE VIVONO
    // ═══════════════════════════════════════════════════════════
    const letters = 'TLON'.split('');
    const letterEls = [];
    const letterPhysics = [];

    letters.forEach((char, i) => {
        const el = document.createElement('div');
        el.className = 'letter';
        el.textContent = char;
        el.style.left = (20 + i * 20) + 'vw';
        el.style.top = '30vh';
        world.appendChild(el);
        letterEls.push(el);
        
        letterPhysics.push({
            x: (20 + i * 20) / 100 * window.innerWidth,
            y: window.innerHeight * 0.3,
            vx: 0,
            vy: 0,
            homeX: (20 + i * 20) / 100 * window.innerWidth,
            homeY: window.innerHeight * 0.3,
            caught: false,
            fear: 0
        });
    });

    // ═══════════════════════════════════════════════════════════
    // PAROLE CHE GALLEGGIANO E DORMONO
    // ═══════════════════════════════════════════════════════════
    const words = [
        'filosofia', 'meraviglia', 'pensiero', 'labirinto', 'immaginazione',
        'Borges', 'pianeta', 'editoria', 'podcast', 'librerie',
        'formazione', 'ricerca', 'festival', 'dialogo', 'incontro'
    ];

    const floatingWords = [];

    words.forEach((word, i) => {
        const el = document.createElement('div');
        el.className = 'floating-word';
        el.textContent = word;
        el.style.left = Math.random() * 80 + 10 + '%';
        el.style.top = Math.random() * 80 + 10 + '%';
        world.appendChild(el);
        
        floatingWords.push({
            el,
            x: parseFloat(el.style.left),
            y: parseFloat(el.style.top),
            baseX: parseFloat(el.style.left),
            baseY: parseFloat(el.style.top),
            phase: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 0.5,
            awake: false
        });
    });

    // ═══════════════════════════════════════════════════════════
    // IL BLOB SEGUE, MA CON RITARDO E FAME
    // ═══════════════════════════════════════════════════════════
    function updateBlob() {
        const dx = mouseX - blobX;
        const dy = mouseY - blobY;
        blobX += dx * 0.05;
        blobY += dy * 0.05;
        blob.style.left = blobX - 150 + 'px';
        blob.style.top = blobY - 150 + 'px';
        
        // Blob size based on activity
        const timeSinceMove = Date.now() - lastMove;
        const scale = Math.max(0.5, 1 - timeSinceMove / 10000);
        blob.style.transform = `scale(${scale})`;
    }

    // ═══════════════════════════════════════════════════════════
    // FISICA DELLE LETTERE
    // ═══════════════════════════════════════════════════════════
    function updateLetters() {
        letterPhysics.forEach((phys, i) => {
            const el = letterEls[i];
            
            // Distanza dal mouse
            const dx = mouseX - phys.x;
            const dy = mouseY - phys.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Paura del mouse
            if (dist < 200) {
                phys.fear = Math.min(1, phys.fear + 0.1);
                phys.vx -= (dx / dist) * 2;
                phys.vy -= (dy / dist) * 2;
            } else {
                phys.fear = Math.max(0, phys.fear - 0.02);
            }
            
            // Ritorno a casa (se non spaventate)
            if (phys.fear < 0.3) {
                phys.vx += (phys.homeX - phys.x) * 0.01;
                phys.vy += (phys.homeY - phys.y) * 0.01;
            }
            
            // Gravità
            phys.vx += gravity.x;
            phys.vy += gravity.y;
            
            // Friction
            phys.vx *= 0.95;
            phys.vy *= 0.95;
            
            // Update position
            phys.x += phys.vx;
            phys.y += phys.vy;
            
            // Boundaries
            const rect = el.getBoundingClientRect();
            if (phys.x < 0) { phys.x = 0; phys.vx *= -0.5; }
            if (phys.x > window.innerWidth - rect.width) { 
                phys.x = window.innerWidth - rect.width; 
                phys.vx *= -0.5; 
            }
            if (phys.y < 0) { phys.y = 0; phys.vy *= -0.5; }
            if (phys.y > window.innerHeight - rect.height) { 
                phys.y = window.innerHeight - rect.height; 
                phys.vy *= -0.5;
            }
            
            el.style.left = phys.x + 'px';
            el.style.top = phys.y + 'px';
            el.style.transform = `rotate(${phys.vx * 2}deg)`;
            el.style.opacity = 1 - phys.fear * 0.5;
        });
    }

    // ═══════════════════════════════════════════════════════════
    // LE PAROLE SI SVEGLIANO VICINO AL MOUSE
    // ═══════════════════════════════════════════════════════════
    function updateFloatingWords(time) {
        floatingWords.forEach(word => {
            // Movimento base
            const floatX = Math.sin(time * 0.001 * word.speed + word.phase) * 2;
            const floatY = Math.cos(time * 0.001 * word.speed + word.phase) * 2;
            
            // Check distance from mouse
            const rect = word.el.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dist = Math.sqrt(Math.pow(mouseX - centerX, 2) + Math.pow(mouseY - centerY, 2));
            
            if (dist < 150) {
                word.el.classList.add('awake');
                // Move slightly toward mouse
                word.x += (mouseX / window.innerWidth * 100 - word.x) * 0.01;
                word.y += (mouseY / window.innerHeight * 100 - word.y) * 0.01;
            } else {
                word.el.classList.remove('awake');
                // Return home slowly
                word.x += (word.baseX - word.x) * 0.02;
                word.y += (word.baseY - word.y) * 0.02;
            }
            
            word.el.style.left = (word.x + floatX) + '%';
            word.el.style.top = (word.y + floatY) + '%';
        });
    }

    // ═══════════════════════════════════════════════════════════
    // BRICIOLE: DOVE SEI STATO
    // ═══════════════════════════════════════════════════════════
    function leaveCrumb() {
        const crumb = document.createElement('div');
        crumb.className = 'crumb';
        crumb.style.left = mouseX + 'px';
        crumb.style.top = mouseY + 'px';
        world.appendChild(crumb);
        crumbs.push({ el: crumb, birth: Date.now() });
        
        // Max 100 crumbs
        if (crumbs.length > 100) {
            const old = crumbs.shift();
            old.el.remove();
        }
    }

    // Fade crumbs
    function updateCrumbs() {
        const now = Date.now();
        crumbs.forEach(crumb => {
            const age = now - crumb.birth;
            crumb.el.style.opacity = Math.max(0, 0.6 - age / 10000);
        });
    }

    // ═══════════════════════════════════════════════════════════
    // IL PORTALE SI APRE SE STAI FERMO
    // ═══════════════════════════════════════════════════════════
    function checkIdle() {
        const now = Date.now();
        const idleFor = now - lastMove;
        
        if (idleFor > 3000) {
            portal.classList.add('open');
            portalText.style.opacity = 1;
        } else {
            portal.classList.remove('open');
            portalText.style.opacity = 0;
        }
        
        // Secret message after long idle
        if (idleFor > 8000) {
            secret.textContent = '«Tlön sarà un labirinto, ma è un labirinto ordito dagli uomini, un labirinto destinato a essere decifrato dagli uomini.»';
            secret.style.opacity = 1;
        } else {
            secret.style.opacity = 0;
        }
    }

    // ═══════════════════════════════════════════════════════════
    // RIPPLE AL CLICK
    // ═══════════════════════════════════════════════════════════
    document.addEventListener('click', (e) => {
        // Create ripple
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = e.clientX - 100 + 'px';
        ripple.style.top = e.clientY - 100 + 'px';
        world.appendChild(ripple);
        setTimeout(() => ripple.remove(), 1000);
        
        // Invert gravity briefly
        gravity.y *= -1;
        setTimeout(() => {
            gravity.y = 0.5;
        }, 2000);
        
        // Push letters away
        letterPhysics.forEach(phys => {
            const dx = phys.x - e.clientX;
            const dy = phys.y - e.clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 400) {
                phys.vx += (dx / dist) * 20;
                phys.vy += (dy / dist) * 20;
            }
        });
    });

    // ═══════════════════════════════════════════════════════════
    // MOUSE MOVE
    // ═══════════════════════════════════════════════════════════
    let crumbCounter = 0;
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        lastMove = Date.now();
        
        crumbCounter++;
        if (crumbCounter % 10 === 0) {
            leaveCrumb();
        }
    });

    // ═══════════════════════════════════════════════════════════
    // TIME DISPLAY
    // ═══════════════════════════════════════════════════════════
    function updateTime() {
        const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        timeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // ═══════════════════════════════════════════════════════════
    // LOOP
    // ═══════════════════════════════════════════════════════════
    function loop(time) {
        updateBlob();
        updateLetters();
        updateFloatingWords(time);
        updateCrumbs();
        checkIdle();
        updateTime();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    // ═══════════════════════════════════════════════════════════
    // RESIZE
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
        letterPhysics.forEach((phys, i) => {
            phys.homeX = (20 + i * 20) / 100 * window.innerWidth;
            phys.homeY = window.innerHeight * 0.3;
        });
    });

    // ═══════════════════════════════════════════════════════════
    // KEYBOARD SECRETS
    // ═══════════════════════════════════════════════════════════
    let konamiCode = [];
    const konamiSequence = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    
    document.addEventListener('keydown', (e) => {
        konamiCode.push(e.key);
        konamiCode = konamiCode.slice(-10);
        
        if (konamiCode.join(',') === konamiSequence.join(',')) {
            // CHAOS MODE
            document.body.style.background = '#2a6b6b';
            letterEls.forEach(el => el.style.color = '#0a0a0a');
            setTimeout(() => {
                document.body.style.background = '#0a0a0a';
                letterEls.forEach(el => el.style.color = '#fff');
            }, 3000);
        }
        
        // Press G to toggle gravity
        if (e.key === 'g') {
            gravity.y = gravity.y === 0 ? 0.5 : 0;
        }
        
        // Press R to reset letters
        if (e.key === 'r') {
            letterPhysics.forEach((phys, i) => {
                phys.x = phys.homeX;
                phys.y = phys.homeY;
                phys.vx = 0;
                phys.vy = 0;
            });
        }
    });
    </script>
</body>
</html>
